[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cabalspy-id"
version = "0.6.0"
description = "SocialFi API & SDK for CabalSpy ID — add a social layer to any app: login with X + verified wallets, live trades and PnL of your users, token theses, leaderboards and copy trading on Solana, BNB Chain, Base, Ethereum and Robinhood Chain."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CabalSpy", email = "contact@cabalspy.xyz" }]
keywords = [
  "socialfi",
  "socialfi-api",
  "socialfi-sdk",
  "socialfi-widget",
  "social-trading",
  "copy-trading",
  "crypto-social",
  "web3-social",
  "kol",
  "kol-tracker",
  "wallet-tracker",
  "trading-leaderboard",
  "pnl",
  "token-thesis",
  "crypto-login",
  "oidc",
  "openid-connect",
  "solana",
  "bnb",
  "base",
  "ethereum",
  "cabalspy",
  "sdk",
  "python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Session",
  "Topic :: Communications",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24", "PyJWT[crypto]>=2.8"]

[project.optional-dependencies]
stream = ["websockets>=14.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.8",
  "ruff>=0.6",
  "websockets>=14.0",
]

[project.urls]
Homepage = "https://id.cabalspy.xyz"
Website = "https://www.cabalspy.xyz/cabalspy-id/"
Documentation = "https://docs.cabalspy.xyz/cabalspy-id"
Repository = "https://github.com/CabalSpy/cabalspy-id-python"
Issues = "https://github.com/CabalSpy/cabalspy-id-python/issues"
Changelog = "https://github.com/CabalSpy/cabalspy-id-python/blob/main/CHANGELOG.md"
Dashboard = "https://apidashboard.cabalspy.xyz/"

[tool.hatch.build.targets.wheel]
packages = ["cabalspy_id"]

[tool.hatch.build.targets.sdist]
include = ["cabalspy_id/**", "tests/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: talks to the real public endpoints (run with -m live)"]
addopts = "-m 'not live'"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["cabalspy_id"]

[[tool.mypy.overrides]]
module = ["websockets", "websockets.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
# README code blocks are aligned by hand for reading
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
# names served lazily by the module __getattr__ (optional websockets dependency)
"cabalspy_id/api.py" = ["F822"]
"cabalspy_id/thesis.py" = ["F822"]
