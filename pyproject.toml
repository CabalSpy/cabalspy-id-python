[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cabalspy-id"
version = "0.1.0"
description = "Official SDK for CabalSpy ID, the verified social layer for crypto trading: Login with CabalSpy ID (OpenID Connect, PKCE, ID token verification), Data API for verified wallets, KOL badges and trading stats (PnL, win rate, holdings), live trade stream and webhook verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CabalSpy", email = "contact@cabalspy.xyz" }]
keywords = [
  "cabalspy", "cabalspy-id", "csid", "login", "oidc", "openid-connect", "oauth2", "pkce",
  "sign-in", "socialfi", "identity", "verified-wallets", "wallet-verification", "kol",
  "kol-badge", "x-login", "twitter-login", "copy-trading", "leaderboard", "pnl", "win-rate",
  "trading-stats", "webhooks", "standard-webhooks", "websocket", "solana", "base", "bnb",
  "ethereum", "robinhood-chain", "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Session",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24", "PyJWT[crypto]>=2.8"]

[project.optional-dependencies]
stream = ["websockets>=14.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.8",
  "ruff>=0.6",
  "websockets>=14.0",
]

[project.urls]
Homepage = "https://id.cabalspy.xyz"
Documentation = "https://docs.cabalspy.xyz/cabalspy-id"
Repository = "https://github.com/CabalSpy/cabalspy-id-python"
Issues = "https://github.com/CabalSpy/cabalspy-id-python/issues"
Changelog = "https://github.com/CabalSpy/cabalspy-id-python/blob/main/CHANGELOG.md"
Dashboard = "https://apidashboard.cabalspy.xyz/"

[tool.hatch.build.targets.wheel]
packages = ["cabalspy_id"]

[tool.hatch.build.targets.sdist]
include = ["cabalspy_id/**", "tests/**", "examples/**", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: talks to the real public endpoints (run with -m live)"]
addopts = "-m 'not live'"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["cabalspy_id"]

[[tool.mypy.overrides]]
module = ["websockets", "websockets.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
# README code blocks are aligned by hand for reading
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF022"]
